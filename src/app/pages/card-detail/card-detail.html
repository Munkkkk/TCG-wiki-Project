<button (click)="goBack()">← Retour</button>

@if (card) {

  <main class="wiki-page">

    <h1>{{ card.name }}</h1>

    <hr>

    <section class="wiki-content">

      <div class="wiki-image">
        <img
          [src]="card.image"
          [alt]="card.name"
        >
      </div>

      <div class="wiki-description">

        <h2>Description</h2>

        <p>
          {{ card.description }}
        </p>

      </div>

    </section>

    <section>

      <h2>Informations</h2>

      <p>
        <strong>Rareté :</strong>
        {{ card.rarity }}
      </p>

    </section>

  </main>

} @else {

  <h1>Carte introuvable</h1>

}
